<!doctype html><html><head><meta charset="utf-8"><title>CarePulse Twin</title><style>body{font-family:Arial;max-width:1000px;margin:30px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #ddd;border-radius:10px;padding:18px}.big{font-size:32px;font-weight:700}</style></head><body><h1>CarePulse Twin</h1><p>Demo patient: P001</p><div class="grid"><div class="card">Risk<div id="risk" class="big">--</div></div><div class="card">Severity<div id="severity" class="big">--</div></div><div class="card">SpO2<div id="spo2" class="big">--</div></div></div><div class="card"><h3>Contributing factors</h3><ul id="factors"></ul></div><div class="card"><h3>Alerts</h3><div id="alerts"></div></div><script>const ws=new WebSocket(`ws://${location.hostname}:8000/ws/patients/P001`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){let s=m.data;document.querySelector('#risk').textContent=(s.risk*100).toFixed(1)+'%';document.querySelector('#severity').textContent=s.severity;document.querySelector('#spo2').textContent=s.vitals.spo2.toFixed(1)+'%';document.querySelector('#factors').innerHTML=s.factors.map(x=>`<li>${x}</li>`).join('')}if(m.type==='alert'){let a=m.data;document.querySelector('#alerts').innerHTML=`<p><b>${a.severity}</b> ${(a.risk*100).toFixed(1)}% — ${a.message}</p>`+document.querySelector('#alerts').innerHTML}};</script></body></html>
